<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="">
  <title>@iwannatodie</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https:; media-src 'self' blob:; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://cdn.discordapp.com; frame-src 'self';">
  <meta property="og:type" content="website">
  <meta property="og:title" content="@iwannatodie">
  <meta property="og:description" content="">
  <meta property="og:site_name" content="@iwannatodie">
  <meta property="og:url" content="https://iwannatodie.netlify.app/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="@iwannatodie">
  <meta name="twitter:description" content="">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.discordapp.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Падающие частицы на фоне -->
  <div class="particles" id="particles" aria-hidden="true"></div>

  <!-- Экран "click to enter..." -->
  <div class="enter-screen" id="enterScreen">
    <span class="enter-text" id="enterText">click to enter...</span>
  </div>

  <!-- Экран входа через Discord -->
  <div class="auth-gate" id="authGate" hidden>
    <div class="auth-card glass">
      <div class="auth-kicker">
        <span class="kicker-dot" aria-hidden="true"></span>
        <span>guns.lol</span>
      </div>
      <h1 class="auth-title">ВОЙТИ<br><em>ЧЕРЕЗ DISCORD</em></h1>
      <p class="auth-text">
        Для просмотра анкеты нужна авторизация через Discord.
        Сайт получит только ID, никнейм и аватар.
      </p>
      <a class="auth-btn" id="authBtn" href="/api/discord-login">
        <span>ВОЙТИ</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17l9.2-9.2M17 17V7H7"/></svg>
      </a>
      <div class="auth-sign">@iwannatodie</div>
    </div>
  </div>

  <!-- Био-страница (после входа) -->
  <div class="bio-page" id="bioPage" hidden>
    <div class="bio-card glass">
      <div class="bio-avatar-wrap">
        <img class="bio-avatar" id="bioAvatar" alt="" width="96" height="96">
      </div>
      <h1 class="bio-name" id="bioName">—</h1>
      <a class="bio-discord" id="bioDiscord" href="https://discord.com/users/861105289361227786" target="_blank" rel="noopener" aria-label="Discord">
        <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
          <path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
        </svg>
      </a>
      <div class="bio-views">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <span id="bioViews">1</span>
      </div>
      <a class="bio-logout" href="/api/logout">выход</a>
    </div>

    <!-- Музыкальный плеер -->
    <div class="player glass" id="player">
      <div class="player-art" aria-hidden="true">
        <div class="vinyl">
          <div class="vinyl-label"></div>
        </div>
      </div>
      <div class="player-info">
        <div class="player-title" id="playerTitle">Tame Impala — The Less I Know The Better</div>
        <div class="player-time">
          <span id="currentTime">0:00</span>
          <div class="player-bar" id="playerBar">
            <div class="player-bar-fill" id="playerBarFill"></div>
          </div>
          <span id="duration">3:36</span>
        </div>
      </div>
      <div class="player-controls">
        <button class="player-btn" id="prevBtn" aria-label="Сначала">
          <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="player-btn" id="playBtn" aria-label="Играть">
          <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M8 5v14l11-7z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" width="20" height="20" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="player-btn" id="nextBtn" aria-label="Заново">
          <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
      <div class="volume-wrap">
        <button class="player-btn" id="muteBtn" aria-label="Звук">
          <svg class="icon-vol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16 9a5 5 0 0 1 0 6M18.5 6.5a9 9 0 0 1 0 11"/></svg>
          <svg class="icon-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18" style="display:none"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="m17 9 5 6m0-6-5 6"/></svg>
        </button>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="100" aria-label="Громкость">
      </div>
    </div>
  </div>

  <audio id="siteTrack" src="track.mp3" preload="auto"></audio>

  <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"78bac8a8700846da9d9bfbada7d15359"}'></script>
  <script src="app.js"></script>
</body>
</html>
